<!doctype html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#1D2A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>متابعة الوكالة</title>
<style>
  :root{--bg:#F3F4F1;--surface:#FBFBF8;--ink:#1D2A2E;--muted:#5F6B6D;--line:#DDE1DC;--accent:#C98503;--ok:#1E7A4F;--ok-soft:#E3F2EA;--bad:#B3261E;--bad-soft:#FBE5E3;--warn:#8A5A00;--warn-soft:#FBF0D9}
  @media (prefers-color-scheme: dark){:root{--bg:#121A1C;--surface:#1B2528;--ink:#EEF1EE;--muted:#9AA7A8;--line:#2C383B;--ok-soft:#173528;--bad-soft:#3A1C1A;--warn-soft:#3A2E14;--ok:#6CC59A;--bad:#F0877F;--warn:#E3A42A}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
  header{background:#1D2A2E;color:#F3F4F1;padding:16px 16px 14px;position:sticky;top:0;z-index:2}
  header h1{margin:0;font-size:1.2rem}
  header .sub{font-size:.8rem;opacity:.75;display:flex;justify-content:space-between;gap:8px;margin-top:2px}
  main{padding:12px 14px 24px;display:grid;gap:12px;max-width:640px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.3}
  .stat span{color:var(--muted);font-size:.8rem}
  .stat.alert b{color:var(--bad)}
  .cars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
  .cars div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
  .cars b{display:block;font-size:1.25rem}
  .cars span{font-size:.72rem;color:var(--muted)}
  section{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  section h2{margin:0;font-size:.95rem;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  section h2 small{color:var(--muted);font-weight:400}
  .item{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item:last-child{border-bottom:0}
  .item .t{font-weight:600}
  .item .s{color:var(--muted);font-size:.82rem}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
  .p-bad{background:var(--bad-soft);color:var(--bad)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
  .empty{padding:14px;color:var(--muted);font-size:.88rem}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
  a.call{color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.8rem}
  .msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
  .msg.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  .stale{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem}
  footer{color:var(--muted);font-size:.75rem;text-align:center;padding:8px}
</style>
</head>
<body>
<header><h1 id="agency">متابعة الوكالة</h1><div class="sub"><span id="upd">…</span><span>للاطلاع فقط</span></div></header>
<main id="app"><div class="msg">جارٍ التحميل…</div></main>
<footer>تتحدّث الصفحة كل دقيقة · أضفها إلى الشاشة الرئيسية من قائمة المتصفح</footer>
<script>
(function(){
  var P = new URLSearchParams(location.hash.slice(1));
  var U = P.get('u'), K = P.get('k'), T = P.get('t'), app = document.getElementById('app');
  if (U && K && T) { try { localStorage.setItem('dash', location.hash); } catch(e){} }
  else { try { var h = localStorage.getItem('dash'); if (h) { P = new URLSearchParams(h.slice(1)); U = P.get('u'); K = P.get('k'); T = P.get('t'); } } catch(e){} }
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function money(n){ return '<span class="num">' + Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '</span> دج'; }
  function dz(iso){ if(!iso) return ''; var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function ago(iso){ var s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return 'الآن'; if (s < 3600) return 'منذ ' + Math.round(s/60) + ' د'; if (s < 86400) return 'منذ ' + Math.round(s/3600) + ' سا'; return 'منذ ' + Math.round(s/86400) + ' يوم'; }
  if (!U || !K || !T) { app.innerHTML = '<div class="msg bad">الرابط غير مكتمل. امسح الرمز من البرنامج (الإعدادات ← المتابعة من الهاتف).</div>'; return; }
  function rentRow(r, kind){
    var badge = r.late ? '<span class="pill p-bad">متأخر ' + r.late + ' يوم</span>' : (kind === 'up' ? '<span class="pill p-warn">يخرج ' + dz(r.start) + '</span>' : '<span class="pill p-ok">عودة ' + dz(r.end) + '</span>');
    return '<div class="item"><div><div class="t">' + esc(r.car) + ' <span class="s">' + esc(r.plate) + '</span></div>' +
      '<div class="s">' + esc(r.client) + ' · العقد ' + esc(r.no) + (r.rest > 0 ? ' · الباقي ' + money(r.rest) : '') + '</div></div>' +
      '<div style="display:grid;gap:6px;justify-items:end">' + badge + (r.phone ? '<a class="call" href="tel:' + esc(r.phone.replace(/\s/g, '')) + '">📞 اتصال</a>' : '') + '</div></div>';
  }
  function render(doc){
    var d = doc.data, c = d.cars, m = d.money;
    document.getElementById('agency').textContent = d.agency || 'متابعة الوكالة';
    document.title = (d.agency || 'الوكالة') + ' — متابعة';
    document.getElementById('upd').textContent = 'آخر تحديث من الحاسوب: ' + ago(doc.updated_at);
    var late = d.current.filter(function(r){ return r.late; }).length;
    var stale = (Date.now() - new Date(doc.updated_at).getTime()) > 30 * 60 * 1000;
    var h = '';
    if (stale) h += '<div class="stale">⚠ الحاسوب لم يرسل جديداً منذ ' + ago(doc.updated_at).replace('منذ ', '') + ': ربما هو مطفأ أو بدون إنترنت.</div>';
    h += '<div class="cars"><div><b>' + c.total + '</b><span>السيارات</span></div><div><b>' + c.rented + '</b><span>مكراة</span></div>' +
         '<div><b>' + c.free + '</b><span>متاحة</span></div><div><b>' + (c.reserved + c.maint) + '</b><span>محجوزة/صيانة</span></div></div>';
    h += '<div class="stats"><div class="stat"><b>' + money(m.today_in) + '</b><span>مقبوضات اليوم</span></div>' +
         '<div class="stat"><b>' + money(m.month_in) + '</b><span>مقبوضات الشهر</span></div>' +
         '<div class="stat"><b>' + money(m.cash) + '</b><span>في الصندوق الآن</span></div>' +
         '<div class="stat ' + (m.unpaid > 0 ? 'alert' : '') + '"><b>' + money(m.unpaid) + '</b><span>مبالغ غير مسددة</span></div></div>';
    h += '<section><h2>السيارات المكراة الآن <small>' + d.current.length + (late ? '، منها ' + late + ' متأخرة' : '') + '</small></h2>' +
         (d.current.length ? d.current.map(function(r){ return rentRow(r, 'cur'); }).join('') : '<div class="empty">لا توجد سيارات مكراة الآن.</div>') + '</section>';
    if (d.upcoming.length) h += '<section><h2>حجوزات الأيام القادمة <small>' + d.upcoming.length + '</small></h2>' + d.upcoming.map(function(r){ return rentRow(r, 'up'); }).join('') + '</section>';
    h += '<section><h2>متاحة للكراء <small>' + d.free_cars.length + '</small></h2>' + (d.free_cars.length ? d.free_cars.map(function(f){
         return '<div class="item"><div class="t">' + esc(f.car) + ' <span class="s">' + esc(f.plate) + '</span></div><div class="s">' + money(f.price) + ' / يوم</div></div>'; }).join('') : '<div class="empty">كل السيارات مشغولة.</div>') + '</section>';
    if (d.alerts.length) h += '<section><h2>تنبيهات <small>' + d.alerts.length + '</small></h2>' + d.alerts.map(function(a){
         return '<div class="item"><div><div class="t">' + esc(a.what) + '</div><div class="s">' + esc(a.car) + '</div></div><span class="pill ' + (a.level === 'bad' ? 'p-bad' : 'p-warn') + '">' +
         (a.due ? dz(a.due) : (a.km ? '<span class="num">' + a.km + ' كم</span>' : '')) + '</span></div>'; }).join('') + '</section>';
    app.innerHTML = h;
  }
  function load(){
    var hd = {'apikey': K, 'Content-Type': 'application/json'}; if (K.indexOf('eyJ') === 0) hd['Authorization'] = 'Bearer ' + K;
    fetch(U.replace(/\/$/, '') + '/rest/v1/rpc/get_dash', {method: 'POST', headers: hd, body: JSON.stringify({p_token: T}), cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(doc){ if (!doc || !doc.data) { app.innerHTML = '<div class="msg bad">هذا الرابط لم يعد يعمل، أو لم يرسل الحاسوب أي ملخص بعد. امسح الرمز الجديد من البرنامج.</div>'; return; } render(doc); })
    .catch(function(){ if (!app.querySelector('section')) app.innerHTML = '<div class="msg bad">تعذّر الاتصال. تحقق من الإنترنت في الهاتف.</div>'; });
  }
  load(); setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
</html>
